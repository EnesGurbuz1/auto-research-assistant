# LLM Konfigürasyonu
llm:
  provider: "google"
  model: "gemini-3.1-pro-preview"
  temperature: 0.3
  max_tokens: 8192
  retry_attempts: 3
  retry_delay: 5

# Arama Kaynakları
sources:
  academic:
    google_scholar: { enabled: true, max_results_per_query: 50 }
    scopus: { enabled: true }
    semantic_scholar: { enabled: true }
    arxiv: { enabled: true }
    web_of_science: { enabled: true }
    proquest: { enabled: true }
  patents:
    espacenet: { enabled: true }
    google_patents: { enabled: true }
    turkpatent: { enabled: true }
    wipo: { enabled: true }
  datasets:
    kaggle: { enabled: true }
    zenodo: { enabled: true }
    huggingface: { enabled: true }
    uci: { enabled: true }
    openml: { enabled: true }
    ieee_dataport: { enabled: true }
    papers_with_code: { enabled: true }
    figshare: { enabled: true }
    mendeley: { enabled: true }

  # Eski format uyumluluğu (agentlar bu path'i de okuyabiliyor)
  scholar:
    enabled: true
    use_serpapi: true
    serpapi_max_requests_monthly: 50
    max_results_per_query: 50
    year_range: [2020, 2026]
    sort_by: "relevance"
  semantic_scholar:
    enabled: true
    max_results_per_query: 50
    fields: ["title", "abstract", "year", "citationCount", "authors", "venue", "openAccessPdf"]
  arxiv:
    enabled: true
    max_results_per_query: 30
    categories: ["cs.MA", "cs.AI", "eess.SY", "cs.LG"]
  scopus:
    enabled: true
    max_results_per_query: 25

# Rapor Konfigürasyonu
report:
  template_path: "templates/rapor_template.docx"
  output_format: ["docx", "markdown", "pdf"]
  language: "tr"

# Eski format uyumluluğu
reporting:
  weekly_day: "friday"
  weekly_hour: "18:00"
  template_path: "templates/rapor_template.docx"
  output_format: "docx"
  auto_github_push: true

# Rate Limiting (kaynak koruma)
rate_limits:
  scholar_delay_sec: 15
  semantic_scholar_rps: 5
  arxiv_delay_sec: 3
  patent_delay_sec: 5

# Otomasyon
automation:
  schedule:
    full_scan: "0 2 * * 1"       # Her Pazartesi 02:00
    incremental_scan: "0 8 * * *" # Her gün 08:00
    report_generation: "0 20 * * 5" # Her Cuma 20:00
    github_sync: "*/30 * * * *"    # Her 30 dk
  github:
    auto_commit: true
    commit_prefix: "[auto-research]"

# GitHub Sync
github:
  repo_name: "oto-research-multi-agent-ev-charging"
  auto_commit: true
  commit_prefix: "[auto-research]"
  push_on_report: true

# Logging
logging:
  level: "INFO"
  file: "logs/agent_runs/latest.log"
  max_size_mb: 10
  backup_count: 5
